[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linscope"
dynamic = ["version"]
description = "Linux security configuration checker with evidence-based reports"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]

[project.scripts]
linscope = "linscope.cli:main"

[tool.setuptools.dynamic]
version = {attr = "linscope.__version__"}

[tool.setuptools.packages.find]
include = ["linscope*"]
